plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def generatedEntityModelsDir = layout.buildDirectory.dir('generated/entity-models')
def generatedEntityModelsFile = generatedEntityModelsDir.map {
    it.file('web/entity-models.json')
}
def entityModelGeneratorWorkDir = layout.buildDirectory.dir('modelgen')

sourceSets {
    modelgen {
        java.srcDir 'src/modelgen/java'
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    main.resources.srcDir generatedEntityModelsDir
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}
        server { args '--nogui' }
    }
}

repositories {
    maven { url = 'https://repo.bluecolored.de/releases' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly "de.bluecolored.bluemap:BlueMapAPI:${bluemap_compile_api_version}"
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('generateEntityModels')

    def properties = [
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        minecraft_version_range: minecraft_version_range,
        forge_version_range: forge_version_range,
        loader_version_range: loader_version_range
    ]
    inputs.properties properties
    filesMatching(['META-INF/mods.toml']) {
        expand properties
    }
}

tasks.register('generateEntityModels', JavaExec) {
    dependsOn tasks.named('compileModelgenJava')
    classpath = sourceSets.modelgen.runtimeClasspath
    mainClass = 'de.decode.bluemapplayermodels.VanillaEntityModelGenerator'
    inputs.files sourceSets.modelgen.output
    inputs.property 'minecraftVersion', minecraft_version
    inputs.property 'forgeVersion', forge_version
    outputs.file generatedEntityModelsFile
    doFirst {
        entityModelGeneratorWorkDir.get().asFile.mkdirs()
        workingDir entityModelGeneratorWorkDir
        args generatedEntityModelsFile.get().asFile.absolutePath
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs.add('-Xlint:deprecation')
}

tasks.named('jar', Jar).configure {
    from 'LICENSE'
    manifest {
        attributes(
            'Specification-Title': mod_name,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion
        )
    }
    finalizedBy 'reobfJar'
}
